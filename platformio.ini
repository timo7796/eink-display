[env:nodemcu-32s]
; Feste Version: Releases sollen reproduzierbar mit dem getesteten Arduino-Core 2.0.17 bauen
platform = espressif32@6.10.0
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
; 2 x 1,9 MB App-Partitionen fuer OTA-Updates (Standard waeren 2 x 1,25 MB)
board_build.partitions = min_spiffs.csv

lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    zinggjm/GxEPD2@^1.6.4
    adafruit/Adafruit GFX Library@^1.11.9
    olikraus/U8g2_for_Adafruit_GFX@^1.8.0